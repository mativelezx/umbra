# Umbra — Módulo ML propio en Fly.io
# Deploy: desde ml/  →  fly apps create umbra-ml-velez   (primera vez: crea la app vacía)
#                       fly deploy --ha=false             (construye la imagen y levanta UNA máquina)
#                       fly deploy                        (siguientes)
# No usar `fly launch`: regenera este archivo con la configuración por defecto
# (1 GB, suspensión automática, dos máquinas, sin carga anticipada).
# La app queda en https://umbra-ml-velez.fly.dev ; en Vercel: ML_API_URL=https://umbra-ml-velez.fly.dev
app = "umbra-ml-velez"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  ML_LOG_LEVEL = "info"
  ML_EAGER_LOAD = "1"

[http_service]
  internal_port = 8000
  force_https = true
  # Sin suspensión: el servicio queda caliente para la demo y para el tribunal.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  # DistilBERT multilingüe + torch consumen ~810 MB residentes: 2 GB deja margen.
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
