# Umbra — Pipeline DVC del módulo ML propio (ADR-026).
# Pipeline declarado; sin dvc.lock histórico no prueba reproducción del bundle.

stages:
  prepare_data:
    cmd: python -m src.prepare_data
    deps:
      - src/prepare_data.py
      - requirements.txt
      - data/latinoamericano/cases.csv
      - data/essays/essays.csv
    outs:
      - data/splits/train.csv
      - data/splits/val.csv
      - data/splits/test.csv
      - data/splits/summary.json

  baseline_tfidf:
    cmd: python -m src.baseline_tfidf
    deps:
      - src/baseline_tfidf.py
      - requirements.txt
      - data/splits/train.csv
      - data/splits/val.csv
      - data/splits/test.csv
    outs:
      - models/baseline_tfidf.joblib
    metrics:
      - metrics_baseline.json:
          cache: false

  train:
    cmd: python -m src.train_ridge
    deps:
      - src/train_ridge.py
      - src/extract_embeddings.py
      - src/embedding_cache.py
      - requirements.txt
      - data/splits/train.csv
      - data/splits/val.csv
    outs:
      - models/ridge_v1.joblib
    metrics:
      - metrics.json:
          cache: false

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/extract_embeddings.py
      - src/embedding_cache.py
      - requirements.txt
      - models/ridge_v1.joblib
      - data/splits/train.csv
      - data/splits/val.csv
      - data/splits/test.csv
    metrics:
      - eval_metrics.json:
          cache: false
