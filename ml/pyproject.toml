[project]
name = "umbra-ml-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "pydantic==2.9.2",
  "transformers==4.44.2",
  "tokenizers==0.19.1",
  "torch==2.4.1+cpu",
  "scikit-learn==1.5.2",
  "numpy==2.1.1",
  "scipy==1.14.1",
  "joblib==1.4.2",
]

[tool.vercel]
entrypoint = "src.api_server:app"

[tool.vercel.scripts]
build = "python build.py"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
